<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <img src="assets/world.png" alt="Globe Icon" class="logo">
      <h1>Country Explorer</h1>
    </div>
  </header>

  <main>
    <section class="filters-container">
      <div class="filter-group">
        <label for="search-input">Search by Country Name:</label>
        <input type="text" id="search-input" placeholder="Enter Country Name" />
      </div>

      <div class="filter-group">
        <label for="region-filter">Select a Region:</label>
        <select id="region-filter">
          <option value="all">All Regions</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="population-filter">Search by Population:</label>
        <input type="number" id="population-filter" value="0" min="0" max="1500000000" step="10000" />
        <small class="helper-text">Max - 1.5 Billion (1500000000)</small>
      </div>
    </section>

    <div id="country-cards-container"></div>

    <button id="show-more-btn">Show More</button>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
