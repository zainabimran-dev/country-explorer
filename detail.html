<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Explorer - Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <img src="assets/world.png" alt="Globe Icon" class="logo">
      <h1>Country Explorer</h1>
    </div>
  </header>

  <main class="detail-main">
    <button id="back-btn">Back</button>

    <section class="detail-container">
      <div class="detail-flag">
        <img id="country-flag" src="" alt="Country Flag">
      </div>

      <div class="detail-info">
        <h2 id="country-name"></h2>
        <p><strong>Population:</strong> <span id="country-population"></span></p>
        <p><strong>Region:</strong> <span id="country-region"></span></p>
        <p><strong>Sub Region:</strong> <span id="country-subregion"></span></p>
        <p><strong>Capital:</strong> <span id="country-capital"></span></p>
        <p><strong>Currencies:</strong> <span id="country-currencies"></span></p>
        <p><strong>Languages:</strong> <span id="country-languages"></span></p>
      </div>
    </section>
  </main>

  <script src="detail.js"></script>
</body>
</html>
